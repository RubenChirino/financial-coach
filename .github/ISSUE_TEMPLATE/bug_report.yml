name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. **For security vulnerabilities, do not open an issue — see [SECURITY.md](../SECURITY.md).**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I click X, the app does Y, but I expected Z.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. See...
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: "v0.1.0 or commit hash"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows (WSL), Windows (native)]
    validations: { required: true }
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "output of `node -v`"
  - type: dropdown
    id: llm
    attributes:
      label: LLM provider (if relevant)
      options: ["n/a", ollama, anthropic, openai, google]
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste logs or drop screenshots. **Redact any PII** (IBANs, amounts, names) before posting.
      render: shell
